publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  rive: ^0.13.20
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.2
  video_player: ^2.9.3
  pdf: ^3.13.1
