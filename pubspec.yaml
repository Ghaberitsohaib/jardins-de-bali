    - assets/03_PHOTOS_ET_RENDUS_3D/Panoramas_360_VR/
    - assets/04_ASSETS_MOBILE_ICONES_LOGOS/Logos/
    - assets/04_ASSETS_MOBILE_ICONES_LOGOS/Icons/
    - assets/04_ASSETS_MOBILE_ICONES_LOGOS/Badges/
