  <style>
    /* ==========================================================================
       1:1 IMMERSIVE FULLSCREEN 3D VIEWPORT (BELGRADE ARBOR /EN/3D STANDARD)
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #1a2219;
      touch-action: none;
    }

    /* Edge-to-edge 3D Canvas Stage: Centers the building in the middle of the screen */
    .arbor-3d-fullscreen-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a2219;
    }

    .arbor-3d-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #1a2219;
    }

    /* Floating Mode Switcher (Glassmorphic Pill at Bottom Center) */
    .arbor-floating-mode-bar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 9999px;
      background: rgba(31, 38, 30, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(204, 191, 153, 0.22);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      transition: all 0.3s ease;
      max-width: calc(100vw - 2rem);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .arbor-floating-mode-bar::-webkit-scrollbar {
      display: none;
    }

    .arbor-mode-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-family: var(--font-workSans), sans-serif;
      color: rgba(253, 251, 239, 0.8);
      background: transparent;
      border: 1px solid transparent;
      transition: all 0.25s ease;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }

    .arbor-mode-pill:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.09);
    }

    .arbor-mode-pill.is-active {
      background: #a68150;
      color: #fff;
      border-color: #a68150;
      box-shadow: 0 4px 14px rgba(166, 129, 80, 0.4);
    }

    /* Minimal Luxury Loading Veil */
    .arbor-3d-loader {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: #1a2219;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.45s ease;
      color: #fdfbef;
      pointer-events: none;
    }

    .arbor-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(166, 129, 80, 0.25);
      border-top-color: #a68150;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
