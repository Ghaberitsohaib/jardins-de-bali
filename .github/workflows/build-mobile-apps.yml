name: Build Jardins de Bali iOS (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [ main, iphone-app ]

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Build iPhone App (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build iOS Release (unsigned .app)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into JardinsDeBali-iOS.ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -r -y JardinsDeBali-iOS.ipa Payload
          ls -lh JardinsDeBali-iOS.ipa

      - name: Upload JardinsDeBali-iOS.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: JardinsDeBali-iOS-IPA
          path: build/ipa/JardinsDeBali-iOS.ipa
          retention-days: 90

      - name: Publish direct-download IPA Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0-iphone"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/ipa/JardinsDeBali-iOS.ipa --clobber
          else
            gh release create "$TAG" build/ipa/JardinsDeBali-iOS.ipa \
              --target "${{ github.ref_name }}" \
              --title "Jardins de Bali iPhone App (.ipa)" \
              --notes "Build iOS officiel Jardins de Bali Marrakech (unsigned IPA pour Sideloadly / AltStore)."
          fi
